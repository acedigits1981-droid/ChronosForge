plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chronosforge.studio'
    compileSdk 35

    defaultConfig {
        applicationId "com.chronosforge.studio"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation("com.topstep.wearkit:sdk-fitcloud:3.0.1") {
        exclude(group = "com.topstep.wearkit", module = "ext-realtek-bbpro")
        exclude(group = "com.topstep.wearkit", module = "ext-realtek-file")
    }
    implementation("io.reactivex.rxjava3:rxandroid:3.0.2")
    implementation("io.reactivex.rxjava3:rxjava:3.1.8")
}
