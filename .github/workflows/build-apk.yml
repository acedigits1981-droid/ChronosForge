name: Build ChronosForge Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Web Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -f "./node_modules/.bin/cap" ]; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi
          if [ -d "android" ] && [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            mkdir -p /tmp/android_backup
            cp -r android/* /tmp/android_backup/ 2>/dev/null || true
            rm -rf android
          fi
          if [ ! -d "android" ]; then
            if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
              ./node_modules/.bin/cap init "ChronosForge Studio" "com.chronosforge.studio" --web-dir=dist
            fi
            ./node_modules/.bin/cap add android
            if [ -d "/tmp/android_backup" ]; then
              cp -rn /tmp/android_backup/* android/ 2>/dev/null || true
            fi
          fi
          ./node_modules/.bin/cap sync android

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android Debug APK
        working-directory: android
        run: |
          sed -i 's/isAllowInsecureProtocol/allowInsecureProtocol/g' settings.gradle build.gradle app/build.gradle 2>/dev/null || true
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosForge-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
