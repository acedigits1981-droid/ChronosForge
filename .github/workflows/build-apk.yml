name: Build ChronosForge Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Web Bundle
        run: npm run build

      - name: Generate Clean Capacitor Android Project
        run: |
          if [ ! -f "./node_modules/.bin/cap" ]; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi
          rm -rf android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            WEB_DIR="dist"
            [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"
            ./node_modules/.bin/cap init "ChronosForge Studio" "com.chronosforge.studio" --web-dir="$WEB_DIR"
          fi
          ./node_modules/.bin/cap add android

      - name: Write NativeWatchBridge.kt & MainActivity.kt
        run: |
          PKG_DIR="android/app/src/main/java/com/chronosforge/studio"
          mkdir -p "$PKG_DIR"
          rm -f "$PKG_DIR/MainActivity.java"

          cat << 'EOF' > "$PKG_DIR/NativeWatchBridge.kt"
          package com.chronosforge.studio

          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanResult
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import com.topstep.fitcloud.sdk.v2.FcSDK
          import com.topstep.fitcloud.sdk.v2.dfu.FcDfuManager
          import io.reactivex.rxjava3.android.schedulers.AndroidSchedulers
          import io.reactivex.rxjava3.disposables.CompositeDisposable
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream

          @SuppressLint("MissingPermission")
          class NativeWatchBridge(
              private val context: Context,
              private val webView: WebView
          ) {
              private val mainHandler = Handler(Looper.getMainLooper())
              private val disposables = CompositeDisposable()
              private val fcSDK: FcSDK = FcSDK.Builder(context.applicationContext).build()
              private var rawGatt: BluetoothGatt? = null

              private fun emitToWeb(eventName: String, payloadJson: String) {
                  mainHandler.post {
                      val escaped = payloadJson.replace("\\", "\\\\").replace("'", "\\'")
                      webView.evaluateJavascript(
                          "window.dispatchEvent(new CustomEvent('$eventName', { detail: JSON.parse('$escaped') }));",
                          null
                      )
                  }
              }

              @JavascriptInterface
              fun scanWatches() {
                  val manager = context.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  val scanner = manager.adapter?.bluetoothLeScanner
                  if (scanner == null) {
                      emitToWeb("native-watch-error", JSONObject().put("message", "Turn on Bluetooth and try scanning again.").toString())
                      return
                  }
                  val callback = object : ScanCallback() {
                      override fun onScanResult(callbackType: Int, result: ScanResult) {
                          val deviceName = result.device.name ?: result.scanRecord?.deviceName ?: return
                          val obj = JSONObject().apply {
                              put("name", deviceName)
                              put("mac", result.device.address)
                              put("rssi", result.rssi)
                          }
                          emitToWeb("native-watch-found", obj.toString())
                      }
                  }
                  scanner.startScan(callback)
                  mainHandler.postDelayed({
                      try { scanner.stopScan(callback) } catch (_: Exception) {}
                  }, 15_000L)
              }

              @JavascriptInterface
              fun connectFitCloudWatch(macAddress: String) {
                  val prefs = context.getSharedPreferences("chronos_watch_prefs", Context.MODE_PRIVATE)
                  val localUserId = prefs.getString("user_id", null) ?: run {
                      val generated = "watch_user_" + (100000..999999).random()
                      prefs.edit().putString("user_id", generated).apply()
                      generated
                  }

                  fcSDK.connector.connect(
                      macAddress,
                      localUserId,
                      true,
                      true,
                      30,
                      175f,
                      75f
                  )

                  val stateSub = fcSDK.connector.observerConnectorState()
                      .observeOn(AndroidSchedulers.mainThread())
                      .subscribe({ state ->
                          val info = fcSDK.deviceInfoAbility.getDeviceInfo()
                          val res = JSONObject().apply {
                              put("state", state.name)
                              put("mac", macAddress)
                              put("lcdWidth", info?.lcdWidth ?: 466)
                              put("lcdHeight", info?.lcdHeight ?: 466)
                              put("isRound", info?.isRound ?: true)
                              put("dialType", info?.dialType ?: 0)
                          }
                          emitToWeb("native-watch-state", res.toString())
                      }, { err ->
                          emitToWeb("native-watch-error", JSONObject().put("message", err.message ?: "Connection error").toString())
                      })
                  disposables.add(stateSub)
              }

              @JavascriptInterface
              fun inspectRawGatt(macAddress: String) {
                  val manager = context.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  val device = manager.adapter.getRemoteDevice(macAddress)
                  rawGatt?.close()
                  rawGatt = device.connectGatt(context, false, object : BluetoothGattCallback() {
                      override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              gatt.discoverServices()
                          }
                      }

                      override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                          val servicesArray = JSONArray()
                          for (service in gatt.services) {
                              val charsArray = JSONArray()
                              for (ch in service.characteristics) {
                                  val props = ch.properties
                                  charsArray.put(JSONObject().apply {
                                      put("uuid", ch.uuid.toString())
                                      put("read", (props and BluetoothGattCharacteristic.PROPERTY_READ) != 0)
                                      put("write", (props and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0)
                                      put("writeNoResp", (props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0)
                                      put("notify", (props and BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0)
                                  })
                              }
                              servicesArray.put(JSONObject().apply {
                                  put("serviceUuid", service.uuid.toString())
                                  put("characteristics", charsArray)
                              })
                          }
                          emitToWeb("native-raw-gatt", servicesArray.toString())
                      }
                  }, BluetoothDevice.TRANSPORT_LE)
              }

              @JavascriptInterface
              fun pushFitCloudBin(base64Data: String) {
                  try {
                      val cleanBase64 = base64Data.substringAfter(",")
                      val binBytes = Base64.decode(cleanBase64, Base64.DEFAULT)
                      val dialFile = File(context.cacheDir, "chronos_custom_dial.bin")
                      FileOutputStream(dialFile).use { it.write(binBytes) }

                      val dfuManager = fcSDK.newDfuManager()
                      val dfuSub = dfuManager.start(FcDfuManager.DfuType.DIAL, dialFile, 0.toByte())
                          .observeOn(AndroidSchedulers.mainThread())
                          .subscribe({ progress ->
                              val status = JSONObject().apply {
                                  put("state", progress.state.name)
                                  put("percent", progress.progress)
                                  put("bytesSent", (binBytes.size * progress.progress) / 100)
                                  put("totalBytes", binBytes.size)
                              }
                              emitToWeb("native-dfu-progress", status.toString())
                          }, { err ->
                              emitToWeb("native-watch-error", JSONObject().put("message", "DFU Failed: ${err.message}").toString())
                          }, {
                              emitToWeb("native-dfu-complete", JSONObject().put("installed", true).toString())
                          })
                      disposables.add(dfuSub)
                  } catch (e: Exception) {
                      emitToWeb("native-watch-error", JSONObject().put("message", e.message ?: "Push failed").toString())
                  }
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.kt"
          package com.chronosforge.studio

          import android.Manifest
          import android.os.Build
          import android.os.Bundle
          import androidx.core.app.ActivityCompat
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT,
                              Manifest.permission.ACCESS_FINE_LOCATION
                          ),
                          1001
                      )
                  } else {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.ACCESS_FINE_LOCATION),
                          1001
                      )
                  }

                  bridge.webView.addJavascriptInterface(
                      NativeWatchBridge(this, bridge.webView),
                      "NativeWatchBridge"
                  )
              }
          }
          EOF

          ./node_modules/.bin/cap sync android

      - name: Configure Gradle, Kotlin, TopStep SDK & Bluetooth Permissions
        run: |
          node -e '
            const fs = require("fs");

            let rootGradle = fs.readFileSync("android/build.gradle", "utf8");
            if (!rootGradle.includes("kotlin-gradle-plugin")) {
              rootGradle = rootGradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24\""
              );
            }
            if (!rootGradle.includes("maven.topstep.com.cn")) {
              rootGradle = rootGradle.replace(
                /allprojects\s*\{\s*repositories\s*\{/,
                "allprojects {\n    repositories {\n        maven { url \"https://jitpack.io\" }\n        maven { url \"http://maven.topstep.com.cn/repository/maven-public/\"; allowInsecureProtocol = true }"
              );
            }
            fs.writeFileSync("android/build.gradle", rootGradle);

            let appGradle = fs.readFileSync("android/app/build.gradle", "utf8");
            appGradle = appGradle.replace(
              /apply plugin:\s*[\x27"]com\.android\.application[\x27"]/,
              "apply plugin: \"com.android.application\"\napply plugin: \"kotlin-android\""
            );
            appGradle += `\nandroid {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n}\n`;
            const sdkDeps = `
              implementation("com.topstep.wearkit:sdk-fitcloud:3.0.1") {
                  exclude group: "com.topstep.wearkit", module: "ext-realtek-bbpro"
                  exclude group: "com.topstep.wearkit", module: "ext-realtek-file"
              }
              implementation "io.reactivex.rxjava3:rxandroid:3.0.2"
              implementation "io.reactivex.rxjava3:rxjava:3.1.8"
          `;
            appGradle = appGradle.replace(/dependencies\s*\{/, "dependencies {" + sdkDeps);
            fs.writeFileSync("android/app/build.gradle", appGradle);

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          `;
            manifest = manifest.replace("<application", perms + "\n    <application");
            fs.writeFileSync(manifestPath, manifest);
          '

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compile Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosForge-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
