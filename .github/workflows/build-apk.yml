name: Build ChronosForge Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Web Bundle
        run: npm run build

      - name: Generate Clean Capacitor Android Project
        run: |
          if [ ! -f "./node_modules/.bin/cap" ]; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi
          rm -rf android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            WEB_DIR="dist"
            [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"
            ./node_modules/.bin/cap init "ChronosForge Studio" "com.chronosforge.studio" --web-dir="$WEB_DIR"
          fi
          ./node_modules/.bin/cap add android

      - name: Fetch Core FitCloudPro Android SDK from GitHub
        run: |
          rm -rf /tmp/fitcloud-sdk
          git clone --depth 1 https://github.com/htangsmart/FitCloudPro-SDK-Android.git /tmp/fitcloud-sdk
          mkdir -p android/app/libs

          COMPAT_AAR=$(find /tmp/fitcloud-sdk -type f -name "sdk-fitcloud-compat-*.aar" | sort -V | tail -n 1)
          if [ -n "$COMPAT_AAR" ]; then
            cp -f "$COMPAT_AAR" android/app/libs/
          else
            MAIN_AAR=$(find /tmp/fitcloud-sdk -type f -name "sdk-fitcloud-*.aar" | sort -V | tail -n 1)
            [ -n "$MAIN_AAR" ] && cp -f "$MAIN_AAR" android/app/libs/
            BASE_AAR=$(find /tmp/fitcloud-sdk -type f -name "sdk-base-*.aar" | sort -V | tail -n 1)
            [ -n "$BASE_AAR" ] && cp -f "$BASE_AAR" android/app/libs/
          fi

          ls -la android/app/libs/

      - name: Write FitCloudPro NativeWatchBridge & Permissions
        run: |
          PKG_DIR="android/app/src/main/java/com/chronosforge/studio"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/NativeWatchBridge.java"
          package com.chronosforge.studio;

          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import io.reactivex.rxjava3.android.schedulers.AndroidSchedulers;
          import io.reactivex.rxjava3.core.Observable;
          import io.reactivex.rxjava3.disposables.CompositeDisposable;
          import io.reactivex.rxjava3.disposables.Disposable;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.lang.reflect.Method;
          import java.util.Random;

          @SuppressLint("MissingPermission")
          public class NativeWatchBridge {
              private final Context context;
              private final WebView webView;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final CompositeDisposable disposables = new CompositeDisposable();
              private Object fcSdk;
              private BluetoothGatt rawGatt;
              private String connectedMac;

              public NativeWatchBridge(Context context, WebView webView) {
                  this.context = context.getApplicationContext();
                  this.webView = webView;
                  initFitCloudSdk();
              }

              private void initFitCloudSdk() {
                  try {
                      Class<?> builderClass = Class.forName("com.topstep.fitcloud.sdk.v2.FcSDK$Builder");
                      Object builder = builderClass.getConstructor(Context.class).newInstance(context);
                      fcSdk = builderClass.getMethod("build").invoke(builder);
                  } catch (Throwable t) {
                      fcSdk = null;
                  }
              }

              private void emitToWeb(String eventName, String payloadJson) {
                  mainHandler.post(() -> {
                      String escaped = payloadJson.replace("\\", "\\\\").replace("'", "\\'");
                      webView.evaluateJavascript(
                          "window.dispatchEvent(new CustomEvent('" + eventName + "', { detail: JSON.parse('" + escaped + "') }));",
                          null
                      );
                  });
              }

              @JavascriptInterface
              public void scanWatches() {
                  try {
                      BluetoothManager manager = (BluetoothManager) context.getSystemService(Context.BLUETOOTH_SERVICE);
                      BluetoothAdapter adapter = manager != null ? manager.getAdapter() : null;
                      BluetoothLeScanner scanner = adapter != null ? adapter.getBluetoothLeScanner() : null;

                      if (scanner == null) {
                          emitToWeb("native-watch-error", "{\"message\":\"Please turn on Bluetooth and Location, then scan again.\"}");
                          return;
                      }

                      ScanCallback callback = new ScanCallback() {
                          @Override
                          public void onScanResult(int callbackType, ScanResult result) {
                              BluetoothDevice dev = result.getDevice();
                              String name = dev.getName();
                              if (name == null && result.getScanRecord() != null) {
                                  name = result.getScanRecord().getDeviceName();
                              }
                              if (name == null || name.isEmpty()) return;

                              try {
                                  JSONObject obj = new JSONObject();
                                  obj.put("name", name);
                                  obj.put("mac", dev.getAddress());
                                  obj.put("rssi", result.getRssi());
                                  emitToWeb("native-watch-found", obj.toString());
                              } catch (Exception ignored) {}
                          }
                      };

                      ScanSettings settings = new ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .build();

                      scanner.startScan(null, settings, callback);
                      mainHandler.postDelayed(() -> {
                          try { scanner.stopScan(callback); } catch (Exception ignored) {}
                      }, 15000L);
                  } catch (Exception e) {
                      emitToWeb("native-watch-error", "{\"message\":\"Scan failed: " + e.getMessage() + "\"}");
                  }
              }

              @JavascriptInterface
              public void connectFitCloudWatch(String macAddress) {
                  connectedMac = macAddress;
                  if (fcSdk == null) {
                      initFitCloudSdk();
                  }
                  if (fcSdk == null) {
                      emitToWeb("native-watch-error", "{\"message\":\"FitCloudPro SDK failed to initialize on this device.\"}");
                      return;
                  }

                  try {
                      SharedPreferences prefs = context.getSharedPreferences("chronos_watch_prefs", Context.MODE_PRIVATE);
                      String localUserId = prefs.getString("user_id", null);
                      if (localUserId == null) {
                          localUserId = "watch_user_" + (100000 + new Random().nextInt(900000));
                          prefs.edit().putString("user_id", localUserId).apply();
                      }

                      Object connector = fcSdk.getClass().getMethod("getConnector").invoke(fcSdk);
                      Method connectMethod = connector.getClass().getMethod(
                          "connect", String.class, String.class, boolean.class, boolean.class, int.class, float.class, float.class
                      );
                      connectMethod.invoke(connector, macAddress, localUserId, true, true, 30, 175f, 75f);

                      @SuppressWarnings("unchecked")
                      Observable<Object> stateObs = (Observable<Object>) connector.getClass()
                          .getMethod("observerConnectorState")
                          .invoke(connector);

                      Disposable sub = stateObs
                          .observeOn(AndroidSchedulers.mainThread())
                          .subscribe(stateObj -> {
                              String stateName = String.valueOf(stateObj);
                              int lcdWidth = 466;
                              int lcdHeight = 466;
                              boolean isRound = true;
                              int dialType = 1;

                              if (stateName.contains("CONNECTED")) {
                                  try {
                                      Object infoAbility = fcSdk.getClass().getMethod("getDeviceInfoAbility").invoke(fcSdk);
                                      Object devInfo = infoAbility.getClass().getMethod("getDeviceInfo").invoke(infoAbility);
                                      if (devInfo != null) {
                                          lcdWidth = (int) devInfo.getClass().getMethod("getLcdWidth").invoke(devInfo);
                                          lcdHeight = (int) devInfo.getClass().getMethod("getLcdHeight").invoke(devInfo);
                                          isRound = (boolean) devInfo.getClass().getMethod("isRound").invoke(devInfo);
                                          dialType = (int) devInfo.getClass().getMethod("getDialType").invoke(devInfo);
                                      }
                                  } catch (Throwable ignored) {}
                              }

                              JSONObject res = new JSONObject();
                              res.put("state", stateName);
                              res.put("mac", macAddress);
                              res.put("lcdWidth", lcdWidth > 0 ? lcdWidth : 466);
                              res.put("lcdHeight", lcdHeight > 0 ? lcdHeight : 466);
                              res.put("isRound", isRound);
                              res.put("dialType", dialType);
                              emitToWeb("native-watch-state", res.toString());
                          }, err -> {
                              emitToWeb("native-watch-error", "{\"message\":\"FitCloud connect error: " + err.getMessage() + "\"}");
                          });
                      disposables.add(sub);
                  } catch (Throwable t) {
                      emitToWeb("native-watch-error", "{\"message\":\"FitCloud bridge error: " + t.getMessage() + "\"}");
                  }
              }

              @JavascriptInterface
              public void inspectRawGatt(String macAddress) {
                  try {
                      BluetoothManager manager = (BluetoothManager) context.getSystemService(Context.BLUETOOTH_SERVICE);
                      BluetoothDevice device = manager.getAdapter().getRemoteDevice(macAddress);
                      if (rawGatt != null) {
                          try { rawGatt.close(); } catch (Exception ignored) {}
                      }
                      rawGatt = device.connectGatt(context, false, new BluetoothGattCallback() {
                          @Override
                          public void onConnectionStateChange(BluetoothGatt gatt, int status, int newState) {
                              if (newState == BluetoothProfile.STATE_CONNECTED) {
                                  gatt.discoverServices();
                              }
                          }

                          @Override
                          public void onServicesDiscovered(BluetoothGatt gatt, int status) {
                              try {
                                  JSONArray servicesArray = new JSONArray();
                                  for (BluetoothGattService service : gatt.getServices()) {
                                      JSONArray charsArray = new JSONArray();
                                      for (BluetoothGattCharacteristic ch : service.getCharacteristics()) {
                                          int props = ch.getProperties();
                                          JSONObject chObj = new JSONObject();
                                          chObj.put("uuid", ch.getUuid().toString());
                                          chObj.put("read", (props & BluetoothGattCharacteristic.PROPERTY_READ) != 0);
                                          chObj.put("write", (props & BluetoothGattCharacteristic.PROPERTY_WRITE) != 0);
                                          chObj.put("writeNoResp", (props & BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0);
                                          chObj.put("notify", (props & BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0);
                                          charsArray.put(chObj);
                                      }
                                      JSONObject svcObj = new JSONObject();
                                      svcObj.put("serviceUuid", service.getUuid().toString());
                                      svcObj.put("characteristics", charsArray);
                                      servicesArray.put(svcObj);
                                  }
                                  emitToWeb("native-raw-gatt", servicesArray.toString());
                              } catch (Exception ignored) {}
                          }
                      }, BluetoothDevice.TRANSPORT_LE);
                  } catch (Exception e) {
                      emitToWeb("native-watch-error", "{\"message\":\"GATT inspect error: " + e.getMessage() + "\"}");
                  }
              }

              @JavascriptInterface
              public void pushFitCloudBin(String base64Data) {
                  if (fcSdk == null) {
                      emitToWeb("native-watch-error", "{\"message\":\"FitCloudPro SDK not ready. Tap Scan and connect to S71 first.\"}");
                      return;
                  }

                  try {
                      String cleanBase64 = base64Data.contains(",") ? base64Data.substring(base64Data.indexOf(",") + 1) : base64Data;
                      byte[] binBytes = Base64.decode(cleanBase64, Base64.DEFAULT);
                      File dialFile = new File(context.getCacheDir(), "chronos_custom_dial.bin");
                      try (FileOutputStream fos = new FileOutputStream(dialFile)) {
                          fos.write(binBytes);
                      }

                      Object dfuManager = fcSdk.getClass().getMethod("newDfuManager").invoke(fcSdk);
                      Class<?> dfuTypeClass = Class.forName("com.topstep.fitcloud.sdk.v2.dfu.FcDfuManager$DfuType");
                      @SuppressWarnings({"unchecked", "rawtypes"})
                      Object dialEnum = Enum.valueOf((Class<Enum>) dfuTypeClass, "DIAL");

                      Method startMethod = null;
                      for (Method m : dfuManager.getClass().getMethods()) {
                          if ("start".equals(m.getName()) && m.getParameterTypes().length == 3) {
                              startMethod = m;
                              break;
                          }
                      }

                      if (startMethod == null) {
                          emitToWeb("native-watch-error", "{\"message\":\"FcDfuManager.start() method not found.\"}");
                          return;
                      }

                      Class<?> thirdParam = startMethod.getParameterTypes()[2];
                      Object binFlagArg = (thirdParam == int.class || thirdParam == Integer.class) ? Integer.valueOf(0) : Byte.valueOf((byte) 0);

                      @SuppressWarnings("unchecked")
                      Observable<Object> dfuObs = (Observable<Object>) startMethod.invoke(dfuManager, dialEnum, dialFile, binFlagArg);

                      Disposable dfuSub = dfuObs
                          .observeOn(AndroidSchedulers.mainThread())
                          .subscribe(progressObj -> {
                              int pct = 0;
                              String stateStr = "DFU_TRANSFERRING";
                              try {
                                  pct = (int) progressObj.getClass().getMethod("getProgress").invoke(progressObj);
                                  Object st = progressObj.getClass().getMethod("getState").invoke(progressObj);
                                  if (st != null) stateStr = String.valueOf(st);
                              } catch (Throwable ignored) {}

                              JSONObject status = new JSONObject();
                              status.put("state", stateStr);
                              status.put("percent", pct);
                              status.put("bytesSent", (binBytes.length * pct) / 100);
                              status.put("totalBytes", binBytes.length);
                              emitToWeb("native-dfu-progress", status.toString());
                          }, err -> {
                              emitToWeb("native-watch-error", "{\"message\":\"S71 DFU Failed: " + err.getMessage() + "\"}");
                          }, () -> {
                              emitToWeb("native-dfu-complete", "{\"installed\":true}");
                          });
                      disposables.add(dfuSub);
                  } catch (Throwable t) {
                      emitToWeb("native-watch-error", "{\"message\":\"Push failed: " + t.getMessage() + "\"}");
                  }
              }

              @JavascriptInterface
              public void pushVeryFitIwf(String base64Data, String macAddress) {
                  emitToWeb("native-watch-error", "{\"message\":\"Direct VeryFit BLE DFU is disabled; use Quick Apply for VeryFit watches.\"}");
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.chronosforge.studio;

          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT,
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          1001
                      );
                  } else {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          1001
                      );
                  }

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(
                          new NativeWatchBridge(this, getBridge().getWebView()),
                          "NativeWatchBridge"
                      );
                  }
              }
          }
          EOF

          node -e '
            const fs = require("fs");

            let appGradle = fs.readFileSync("android/app/build.gradle", "utf8");
            const sdkDeps = `
              implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
              implementation "com.google.android.material:material:1.12.0"
              implementation "com.google.code.gson:gson:2.10.1"
              implementation "io.reactivex.rxjava3:rxandroid:3.0.2"
              implementation "io.reactivex.rxjava3:rxjava:3.1.8"
              implementation "com.jakewharton.rxrelay3:rxrelay:3.0.1"
              implementation "no.nordicsemi.android:ble:2.6.1"
              implementation "no.nordicsemi.android.support.v18:scanner:1.6.0"
              implementation "no.nordicsemi.android:dfu:2.5.0"
          `;
            appGradle = appGradle.replace(/dependencies\s*\{/, "dependencies {" + sdkDeps);
            fs.writeFileSync("android/app/build.gradle", appGradle);

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
          `;
            manifest = manifest.replace("<application", perms + "\n    <application");
            fs.writeFileSync(manifestPath, manifest);
          '

          ./node_modules/.bin/cap sync android

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compile Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosForge-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct Download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ChronosForge-Studio.apk
          TAG="v1.0.${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ChronosForge-Studio.apk --clobber
          else
            gh release create "$TAG" ChronosForge-Studio.apk \
              --title "ChronosForge Studio $TAG" \
              --notes "Direct Android APK download with official FitCloudPro S71 DFU support (Build #${{ github.run_number }})." \
              --latest
          fi
