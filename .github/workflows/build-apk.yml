name: Build ChronosForge Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Web Bundle
        run: npm run build

      - name: Generate Clean Capacitor Android Project
        run: |
          if [ ! -f "./node_modules/.bin/cap" ]; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi
          rm -rf android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            WEB_DIR="dist"
            [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"
            ./node_modules/.bin/cap init "ChronosForge Studio" "com.chronosforge.studio" --web-dir="$WEB_DIR"
          fi
          ./node_modules/.bin/cap add android

      - name: Write Native Android Bluetooth Bridge & Permissions
        run: |
          PKG_DIR="android/app/src/main/java/com/chronosforge/studio"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/NativeWatchBridge.java"
          package com.chronosforge.studio;

          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattDescriptor;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.Arrays;
          import java.util.UUID;

          @SuppressLint("MissingPermission")
          public class NativeWatchBridge {
              private static final UUID CCCD_UUID = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb");
              private static final UUID VERYFIT_SERVICE = UUID.fromString("00000af0-0000-1000-8000-00805f9b34fb");
              private static final UUID VERYFIT_WRITE = UUID.fromString("00000af6-0000-1000-8000-00805f9b34fb");

              private final Context context;
              private final WebView webView;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private BluetoothGatt activeGatt;
              private BluetoothGattCharacteristic activeWriteChar;
              private String connectedMac;
              private int negotiatedMtu = 23;
              private volatile boolean cancelRequested = false;

              public NativeWatchBridge(Context context, WebView webView) {
                  this.context = context.getApplicationContext();
                  this.webView = webView;
              }

              private void emitToWeb(String eventName, String payloadJson) {
                  mainHandler.post(() -> {
                      String escaped = payloadJson.replace("\\", "\\\\").replace("'", "\\'");
                      webView.evaluateJavascript(
                          "window.dispatchEvent(new CustomEvent('" + eventName + "', { detail: JSON.parse('" + escaped + "') }));",
                          null
                      );
                  });
              }

              @JavascriptInterface
              public void scanWatches() {
                  try {
                      BluetoothManager manager = (BluetoothManager) context.getSystemService(Context.BLUETOOTH_SERVICE);
                      BluetoothAdapter adapter = manager != null ? manager.getAdapter() : null;
                      BluetoothLeScanner scanner = adapter != null ? adapter.getBluetoothLeScanner() : null;

                      if (scanner == null) {
                          emitToWeb("native-watch-error", "{\"message\":\"Please turn on Bluetooth and Location, then try again.\"}");
                          return;
                      }

                      ScanCallback callback = new ScanCallback() {
                          @Override
                          public void onScanResult(int callbackType, ScanResult result) {
                              BluetoothDevice dev = result.getDevice();
                              String name = dev.getName();
                              if (name == null && result.getScanRecord() != null) {
                                  name = result.getScanRecord().getDeviceName();
                              }
                              if (name == null || name.isEmpty()) return;

                              try {
                                  JSONObject obj = new JSONObject();
                                  obj.put("name", name);
                                  obj.put("mac", dev.getAddress());
                                  obj.put("rssi", result.getRssi());
                                  emitToWeb("native-watch-found", obj.toString());
                              } catch (Exception ignored) {}
                          }
                      };

                      ScanSettings settings = new ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .build();

                      scanner.startScan(null, settings, callback);
                      mainHandler.postDelayed(() -> {
                          try { scanner.stopScan(callback); } catch (Exception ignored) {}
                      }, 15000L);
                  } catch (Exception e) {
                      emitToWeb("native-watch-error", "{\"message\":\"Scan failed: " + e.getMessage() + "\"}");
                  }
              }

              @JavascriptInterface
              public void connectFitCloudWatch(String macAddress) {
                  connectAndInspect(macAddress);
              }

              @JavascriptInterface
              public void inspectRawGatt(String macAddress) {
                  if (activeGatt != null && macAddress.equals(connectedMac) && !activeGatt.getServices().isEmpty()) {
                      emitGattServices(activeGatt);
                      return;
                  }
                  connectAndInspect(macAddress);
              }

              private void connectAndInspect(String macAddress) {
                  try {
                      connectedMac = macAddress;
                      BluetoothManager manager = (BluetoothManager) context.getSystemService(Context.BLUETOOTH_SERVICE);
                      BluetoothDevice device = manager.getAdapter().getRemoteDevice(macAddress);

                      if (device.getBondState() == BluetoothDevice.BOND_NONE) {
                          try { device.createBond(); } catch (Exception ignored) {}
                      }

                      if (activeGatt != null) {
                          try { activeGatt.close(); } catch (Exception ignored) {}
                      }
                      activeWriteChar = null;
                      negotiatedMtu = 23;

                      activeGatt = device.connectGatt(context, false, new BluetoothGattCallback() {
                          @Override
                          public void onConnectionStateChange(BluetoothGatt gatt, int status, int newState) {
                              if (newState == BluetoothProfile.STATE_CONNECTED) {
                                  try {
                                      gatt.requestConnectionPriority(BluetoothGatt.CONNECTION_PRIORITY_HIGH);
                                      gatt.requestMtu(247);
                                  } catch (Exception e) {
                                      gatt.discoverServices();
                                  }
                              } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                                  emitToWeb("native-watch-error", "{\"message\":\"Watch disconnected. Keep watch awake and close stock app.\"}");
                              }
                          }

                          @Override
                          public void onMtuChanged(BluetoothGatt gatt, int mtu, int status) {
                              if (status == BluetoothGatt.GATT_SUCCESS && mtu > 23) {
                                  negotiatedMtu = mtu;
                              }
                              gatt.discoverServices();
                          }

                          @Override
                          public void onServicesDiscovered(BluetoothGatt gatt, int status) {
                              emitGattServices(gatt);
                              try {
                                  JSONObject state = new JSONObject();
                                  state.put("state", "CONNECTED");
                                  state.put("mac", macAddress);
                                  state.put("lcdWidth", 466);
                                  state.put("lcdHeight", 466);
                                  state.put("isRound", true);
                                  state.put("dialType", 1);
                                  emitToWeb("native-watch-state", state.toString());
                              } catch (Exception ignored) {}
                          }
                      }, BluetoothDevice.TRANSPORT_LE);
                  } catch (Exception e) {
                      emitToWeb("native-watch-error", "{\"message\":\"Connect error: " + e.getMessage() + "\"}");
                  }
              }

              private void emitGattServices(BluetoothGatt gatt) {
                  try {
                      JSONArray servicesArray = new JSONArray();
                      BluetoothGattCharacteristic fallbackWrite = null;

                      for (BluetoothGattService service : gatt.getServices()) {
                          String svcUuid = service.getUuid().toString().toLowerCase();
                          boolean isGeneric = svcUuid.startsWith("00001800") || svcUuid.startsWith("00001801") || svcUuid.startsWith("0000180a");
                          JSONArray charsArray = new JSONArray();

                          for (BluetoothGattCharacteristic ch : service.getCharacteristics()) {
                              int props = ch.getProperties();
                              boolean canRead = (props & BluetoothGattCharacteristic.PROPERTY_READ) != 0;
                              boolean canWrite = (props & BluetoothGattCharacteristic.PROPERTY_WRITE) != 0;
                              boolean canWriteNoResp = (props & BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0;
                              boolean canNotify = (props & BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0;

                              if (canNotify) {
                                  try {
                                      gatt.setCharacteristicNotification(ch, true);
                                      BluetoothGattDescriptor desc = ch.getDescriptor(CCCD_UUID);
                                      if (desc != null) {
                                          if (Build.VERSION.SDK_INT >= 33) {
                                              gatt.writeDescriptor(desc, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                                          } else {
                                              desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                                              gatt.writeDescriptor(desc);
                                          }
                                      }
                                  } catch (Exception ignored) {}
                              }

                              if (VERYFIT_SERVICE.equals(service.getUuid()) && VERYFIT_WRITE.equals(ch.getUuid())) {
                                  activeWriteChar = ch;
                              } else if (!isGeneric && (canWrite || canWriteNoResp) && fallbackWrite == null) {
                                  fallbackWrite = ch;
                              }

                              JSONObject chObj = new JSONObject();
                              chObj.put("uuid", ch.getUuid().toString());
                              chObj.put("read", canRead);
                              chObj.put("write", canWrite);
                              chObj.put("writeNoResp", canWriteNoResp);
                              chObj.put("notify", canNotify);
                              charsArray.put(chObj);
                          }

                          JSONObject svcObj = new JSONObject();
                          svcObj.put("serviceUuid", service.getUuid().toString());
                          svcObj.put("characteristics", charsArray);
                          servicesArray.put(svcObj);
                      }

                      if (activeWriteChar == null) {
                          activeWriteChar = fallbackWrite;
                      }
                      emitToWeb("native-raw-gatt", servicesArray.toString());
                  } catch (Exception ignored) {}
              }

              @JavascriptInterface
              public void pushFitCloudBin(String base64Data) {
                  streamBinaryPayload(base64Data);
              }

              @JavascriptInterface
              public void pushVeryFitIwf(String base64Data, String macAddress) {
                  streamBinaryPayload(base64Data);
              }

              private void streamBinaryPayload(String base64Data) {
                  if (activeGatt == null || activeWriteChar == null) {
                      emitToWeb("native-watch-error", "{\"message\":\"No writable watch channel bound. Inspect Raw GATT below or use Quick Apply.\"}");
                      return;
                  }

                  cancelRequested = false;
                  new Thread(() -> {
                      try {
                          String clean = base64Data.contains(",") ? base64Data.substring(base64Data.indexOf(",") + 1) : base64Data;
                          byte[] payload = Base64.decode(clean, Base64.DEFAULT);
                          int chunkSize = Math.max(20, Math.min(240, negotiatedMtu - 3));
                          int props = activeWriteChar.getProperties();
                          int writeType = (props & BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                              ? BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                              : BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT;

                          int offset = 0;
                          while (offset < payload.length && !cancelRequested) {
                              int end = Math.min(offset + chunkSize, payload.length);
                              byte[] slice = Arrays.copyOfRange(payload, offset, end);

                              if (Build.VERSION.SDK_INT >= 33) {
                                  activeGatt.writeCharacteristic(activeWriteChar, slice, writeType);
                              } else {
                                  activeWriteChar.setWriteType(writeType);
                                  activeWriteChar.setValue(slice);
                                  activeGatt.writeCharacteristic(activeWriteChar);
                              }

                              offset = end;
                              int pct = (int) ((offset * 100L) / payload.length);
                              JSONObject prog = new JSONObject();
                              prog.put("state", "STREAMING");
                              prog.put("percent", pct);
                              prog.put("bytesSent", offset);
                              prog.put("totalBytes", payload.length);
                              emitToWeb("native-dfu-progress", prog.toString());
                              Thread.sleep(16);
                          }

                          if (!cancelRequested) {
                              emitToWeb("native-dfu-complete", "{\"installed\":true}");
                          }
                      } catch (Exception e) {
                          emitToWeb("native-watch-error", "{\"message\":\"Transfer error: " + e.getMessage() + "\"}");
                      }
                  }).start();
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.chronosforge.studio;

          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{
                              Manifest.permission.BLUETOOTH_SCAN,
                              Manifest.permission.BLUETOOTH_CONNECT,
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          1001
                      );
                  } else {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION
                          },
                          1001
                      );
                  }

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(
                          new NativeWatchBridge(this, getBridge().getWebView()),
                          "NativeWatchBridge"
                      );
                  }
              }
          }
          EOF

          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          `;
            manifest = manifest.replace("<application", perms + "\n    <application");
            fs.writeFileSync(manifestPath, manifest);
          '

          ./node_modules/.bin/cap sync android

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compile Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosForge-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct Download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ChronosForge-Studio.apk
          TAG="v1.0.${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ChronosForge-Studio.apk --clobber
          else
            gh release create "$TAG" ChronosForge-Studio.apk \
              --title "ChronosForge Studio $TAG" \
              --notes "Direct Android APK download for ChronosForge Studio (Build #${{ github.run_number }})." \
              --latest
          fi
